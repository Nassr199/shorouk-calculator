
name: Build Shorouk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Shorouk Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify uploaded ZIP
        run: |
          test -f shorouk-calculator-v3-android-ready.zip
          unzip -tq shorouk-calculator-v3-android-ready.zip
          unzip -Z1 shorouk-calculator-v3-android-ready.zip | grep -qx 'shorouk-src/package.json'

      - name: Extract project
        run: unzip -q shorouk-calculator-v3-android-ready.zip -d .

      - name: Verify extracted project
        run: |
          test -f shorouk-src/package.json
          test -f shorouk-src/capacitor.config.ts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: yes
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies
        working-directory: shorouk-src
        run: npm install --no-audit --no-fund

      - name: Build web application
        working-directory: shorouk-src
        run: npm run build

      - name: Create Android project
        working-directory: shorouk-src
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#134448' --iconBackgroundColorDark '#030C0E' --splashBackgroundColor '#C9DBDA' --splashBackgroundColorDark '#030C0E'
          npx cap sync android

      - name: Compile APK
        working-directory: shorouk-src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f shorouk-src/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh shorouk-src/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Shorouk-Calculator-APK
          path: shorouk-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
