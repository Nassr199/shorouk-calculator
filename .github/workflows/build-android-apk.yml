
name: Build Shorouk Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verify and extract project ZIP
        run: |
          ZIP_FILE="shorouk-calculator-android-v3.1.1-fixed.zip"
          test -f "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          test -f extracted-project/shorouk-android/gradlew
          test -f extracted-project/shorouk-android/settings.gradle.kts
          test -f extracted-project/shorouk-android/app/build.gradle.kts

      - name: Make Gradle wrapper executable
        working-directory: extracted-project/shorouk-android
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: extracted-project/shorouk-android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shorouk-calculator-release-apk
          path: extracted-project/shorouk-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
