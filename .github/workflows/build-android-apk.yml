
name: Build Shorouk APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q shorouk-calculator-v3-android-ready.zip -d .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: shorouk-src
        run: npm install --no-audit --no-fund

      - name: Build application
        working-directory: shorouk-src
        run: npm run build

      - name: Create Android project
        working-directory: shorouk-src
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#134448' --iconBackgroundColorDark '#030C0E' --splashBackgroundColor '#C9DBDA' --splashBackgroundColorDark '#030C0E'
          npx cap sync android

      - name: Compile APK
        working-directory: shorouk-src/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shorouk-Calculator-APK
          path: shorouk-src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
