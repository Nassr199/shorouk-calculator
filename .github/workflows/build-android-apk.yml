
name: Build Shorouk Calculator APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: _android_zip/shorouk-android
        run: chmod +x ./gradlew

      - name: Run unit tests
        working-directory: _android_zip/shorouk-android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK
        working-directory: _android_zip/shorouk-android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shorouk-calculator-release-apk
          path: _android_zip/shorouk-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
